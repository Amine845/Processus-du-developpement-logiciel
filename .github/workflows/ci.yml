name: CI

on:
  push:
    branches: [main, pm, 'pm/**', 'qwantike/**']
  pull_request:
    branches: [main, pm]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Audit de sécurité npm
        run: npm audit --audit-level=high

      - name: Vérification du formatage
        run: npm run format:check

      - name: Linter ESLint
        run: npm run lint

      - name: Vérification des types TypeScript
        run: npx tsc --noEmit

      - name: Valider les migrations et contraintes SQLite
        run: npm run test:db

      - name: Tester le repository sur une base temporaire
        run: npm run test:repository

      - name: Tester le seed sur une base temporaire
        run: npm run test:seed

      - name: Tester le sous-ensemble CIQUAL sur des bases temporaires
        run: npm run test:ciqual

      - name: Tester les mises à jour CIQUAL hors réseau
        run: npm run test:ciqual:sync

      - name: Tester les tags d'ingrédients sur une base temporaire
        run: npm run test:tags

      - name: Tester classification, migration et API CIQUAL
        run: npm run test:ciqual:classification

      - name: Tester la recherche API CIQUAL
        run: npm run test:ciqual:api

      - name: Tester la conservation CIQUAL dans les recettes
        run: npm run test:recipe:ciqual

      - name: Tests unitaires et parcours React vers API
        run: npm test

      - name: Build de l'application
        run: npm run build
